<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generate HR Letter</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    margin:0;
}

header{
    background:#3b6dab;
    color:white;
    text-align:center;
    padding:15px;
}

.container{
    width:60%;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:20px;
}

button{
    background:#3b6dab;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}

</style>
</head>

<body>

<header>
📄 Generate HR Letter
</header>

<div class="container">

<input
type="text"
id="employee"
placeholder="Employee Name"
/>

<select id="type">

<option>Offer Letter</option>
<option>Warning Letter</option>
<option>Experience Letter</option>

</select>

<textarea
id="content"
rows="10"
placeholder="Letter content..."
></textarea>

<button onclick="generateLetter()">
Generate Letter
</button>

</div>

<script>

async function generateLetter(){

    const employee_name =
        document.getElementById("employee").value;

    const letter_type =
        document.getElementById("type").value;

    const content =
        document.getElementById("content").value;

    const res = await fetch(
        "/api/hr/letters",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json",

                "x-session-id":
                localStorage.getItem("sessionId")
            },

            body:JSON.stringify({
                employee_name,
                letter_type,
                content
            })

        }
    );

    const data = await res.json();

    alert(data.message);

}

</script>

</body>
</html>

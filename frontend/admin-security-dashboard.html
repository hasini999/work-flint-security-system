<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Security Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
  body {
    font-family: Arial;
    margin: 0;
    background: #0f172a;
    color: white;
  }

  header {
    background: #1e293b;
    padding: 20px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    padding: 20px;
  }

  .card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
  }

  .card h2 {
    font-size: 28px;
    margin: 0;
    color: #38bdf8;
  }

  .card p {
    margin: 5px 0 0;
    color: #94a3b8;
  }

  .section {
    margin: 20px;
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    padding: 10px;
    border-bottom: 1px solid #334155;
    text-align: left;
  }

  th {
    color: #38bdf8;
  }

  .high { color: red; font-weight: bold; }
  .medium { color: orange; font-weight: bold; }
  .low { color: lightgreen; font-weight: bold; }

  .live {
    color: #22c55e;
    font-weight: bold;
  }

  a {
  color: #38bdf8;
  text-decoration: none;
  font-weight: bold;
}

a:hover {
  color: #0ea5e9;
}


.btn {
  background: #38bdf8;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin: 20px;
}

.btn:hover {
  background: #0ea5e9;
}


</style>
</head>

<body>

<header>
  🛡 ADMIN SECURITY DASHBOARD (REAL-TIME INSIDER THREAT MONITORING)
</header>

<!-- STATS -->
<div class="grid">

  <div class="card">
    <h2 id="totalAlerts">0</h2>
    <p>Total Alerts</p>
  </div>

  <div class="card">
    <h2 id="critical">0</h2>
    <p>Critical Threats</p>
  </div>

  <div class="card">
    <h2 id="honeypots">0</h2>
    <p>Honeypot Triggers</p>
  </div>

  <div class="card">
    <h2 class="live" id="liveStatus">LIVE</h2>
    <p>Monitoring Status</p>
  </div>

</div>

<!-- TABLE -->
<div class="section">
  <h3>⚡ Live Security Event Feed</h3>

  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Event</th>
        <th>Page</th>
        <th>Status</th>
        <th>Risk</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="logTable"></tbody>
  </table>
</div>

<!-- USERS -->
<div class="section">
  <h3>🔥 Top Risk Users</h3>
  <ul id="riskUsers"></ul>
</div>

<button onclick="logout()" class="btn">
  Logout
</button>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="dashboard-common.js"></script>
<script>

const socket = io("http://localhost:3000");
socket.on("connect", () => {
  console.log("✅ Socket Connected");
});

/* =========================
   REAL-TIME UPDATES
========================= */

socket.on("security-alert", (data) => {

  console.log("🔥 LIVE EVENT:", data);

  addLiveEvent(data);

  updateStatsRealtime(data);

  loadRiskUsers();

});

/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard() {

  try {

    const res = await safeApiFetch("/api/security-logs");

    if (!res) return;
    const data = await res.json();

    const table = document.getElementById("logTable");

    table.innerHTML = "";

    let total = data.length;
    let critical = 0;
    let honeypot = 0;

    data.forEach(log => {

      const type = (log.event_type || "").toLowerCase();

      if (
        type.includes("root") ||
        type.includes("disable") ||
        type.includes("master")
      ) {
        critical++;
      }

      if (
        type.includes("honeypot") ||
        type.includes("surveillance")
      ) {
        honeypot++;
      }

      const risk =
        type.includes("root") || type.includes("disable")
          ? "CRITICAL"
          : type.includes("honeypot")
          ? "HIGH"
          : "LOW";

      table.innerHTML += `
        <tr>
          <td>${new Date(log.created_at).toLocaleString()}</td>
          <td>${log.event_type}</td>
          <td>${log.description || "-"}</td>
          <td>${log.severity || "LOW"}</td>
          <td>${risk}</td>
          <td>
            <button onclick="showSummary(${log.id}, '${log.event_type}')">
              🧠 AI Summary
            </button>

            <br><br>

            <a href="/api/security/report/pdf/${log.id}" target="_blank">
              📄 PDF Report
            </a>
          </td>
        </tr>
      `;
    });

    document.getElementById("totalAlerts").innerText = total;
    document.getElementById("critical").innerText = critical;
    document.getElementById("honeypots").innerText = honeypot;

  } catch (err) {

    console.log(err);

  }
}

/* =========================
   AI SUMMARY
========================= */

function showSummary(id, eventType) {

  const type = eventType.toLowerCase();

  let severity = "LOW";
  let explanation = "";
  let impact = "";
  let recommendation = "";

  if (type.includes("root")) {

    severity = "CRITICAL";

    explanation =
      "Privilege escalation attempt detected.";

    impact =
      "Attacker may gain full system control.";

    recommendation =
      "Immediately isolate user account and audit logs.";

  } else if (type.includes("honeypot")) {

    severity = "HIGH";

    explanation =
      "User interacted with hidden decoy resources.";

    impact =
      "Possible insider reconnaissance activity.";

    recommendation =
      "Increase monitoring and review user actions.";

  } else if (type.includes("export")) {

    severity = "MEDIUM";

    explanation =
      "Sensitive data export attempt detected.";

    impact =
      "Potential data exfiltration risk.";

    recommendation =
      "Review exported resources and verify permissions.";

  } else {

    severity = "LOW";

    explanation =
      "General low-risk system activity.";

    impact =
      "Minimal security impact.";

    recommendation =
      "Continue monitoring.";
  }

  alert(
`🧠 AI SECURITY ANALYSIS

Severity:
${severity}

Explanation:
${explanation}

Business Impact:
${impact}

Recommendation:
${recommendation}`
  );
}


/* =========================
   ADD LIVE EVENT
========================= */

function addLiveEvent(data) {

  const table = document.getElementById("logTable");

  const riskClass =
    data.risk >= 50
      ? "high"
      : data.risk >= 30
      ? "medium"
      : "low";

  const row = `
    <tr>
      <td>${new Date().toLocaleTimeString()}</td>
      <td>${data.event}</td>
      <td>${data.page}</td>
      <td class="${riskClass}">LIVE</td>
      <td>${data.risk}</td>
      <td>⚡ Real-Time Event</td>
    </tr>
  `;

  table.innerHTML = row + table.innerHTML;
}

/* =========================
   UPDATE LIVE STATS
========================= */

function updateStatsRealtime(data) {

  let total =
    parseInt(document.getElementById("totalAlerts").innerText);

  let critical =
    parseInt(document.getElementById("critical").innerText);

  let honeypot =
    parseInt(document.getElementById("honeypots").innerText);

  total++;

  
    if (
  data.event.toLowerCase().includes("root") ||
  data.event.toLowerCase().includes("disable")

  ) {
    critical++;
  }

  if (
    data.event.toLowerCase().includes("honeypot") ||
    data.event.toLowerCase().includes("surveillance")
  ) {
    honeypot++;
  }

  document.getElementById("totalAlerts").innerText = total;
  document.getElementById("critical").innerText = critical;
  document.getElementById("honeypots").innerText = honeypot;
}

/* =========================
   TOP RISK USERS
========================= */

async function loadRiskUsers() {

  try {

    const res = await safeApiFetch("/api/users");

    if (!res) return;
    const users = await res.json();

    users.sort(
      (a, b) => (b.risk_score || 0) - (a.risk_score || 0)
    );

    const list = document.getElementById("riskUsers");

    list.innerHTML = "";

    users.slice(0, 5).forEach(u => {

      list.innerHTML += `
<li style="margin-bottom:15px;">

  <b>${u.name}</b> (${u.role})
  <br>

  Risk Score:
  <span style="color:red;">
    ${u.risk_score || 0}
  </span>

  <br><br>

  <button onclick="blockUser('${u.email}')">
    🚫 Block
  </button>

  <button onclick="unblockUser('${u.email}')">
    ✅ Unblock
  </button>

  <button onclick="resetRisk('${u.email}')">
    🔄 Reset Risk
  </button>

</li>
`;
    });

  } catch (err) {

    console.log(err);

  }
}

/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.clear();

  alert("Logged out successfully");

  window.location.href = "login.html";
}

async function blockUser(email) {

  const res = await safeApiFetch(
    "/api/block-user",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    }
  );

  const data = await res.json();

  alert(data.message);

  loadRiskUsers();
}

async function unblockUser(email) {

  const res = await safeApiFetch(
    "/api/unblock-user",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    }
  );

  const data = await res.json();

  alert(data.message);

  loadRiskUsers();
}

async function resetRisk(email) {

  const res = await safeApiFetch(
    "/api/reset-risk",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    }
  );

  const data = await res.json();

  alert(data.message);

  loadRiskUsers();
}

/* =========================
   INIT
========================= */

loadDashboard();

loadRiskUsers();

/* Refresh ONLY risk users */
setInterval(loadRiskUsers, 10000);
setInterval(loadDashboard, 5000);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pending Requests</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

header {
  background: #3b6dab;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 20px;
}

.request {
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.btn {
  margin-right: 10px;
  padding: 8px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

.approve { background: green; color: white; }
.reject { background: red; color: white; }
</style>
</head>

<body>

<header>
  📋 Pending HR Requests
</header>

<div class="container">

  <table width="100%" cellpadding="10">

    <thead>

      <tr style="background:#3b6dab; color:white;">

        <th>Employee</th>
        <th>Request</th>
        <th>Status</th>
        <th>Action</th>

      </tr>

    </thead>

    <tbody id="requestTable"></tbody>

  </table>

</div>

<script>

async function loadRequests() {

    const res = await fetch(
        "/api/hr/requests",
        {
            headers: {
                "x-session-id":
                localStorage.getItem("sessionId")
            }
        }
    );

    const data = await res.json();

    const table =
        document.getElementById("requestTable");

    table.innerHTML = "";

    data.forEach(req => {

        table.innerHTML += `
        <tr style="background:white;">

            <td>${req.employee_name}</td>

            <td>${req.request_type}</td>

            <td>${req.status}</td>

            <td>

                <button
                    class="btn approve"
                    onclick="updateRequest(
                        ${req.id},
                        'Approved'
                    )">

                    Approve

                </button>

                <button
                    class="btn reject"
                    onclick="updateRequest(
                        ${req.id},
                        'Rejected'
                    )">

                    Reject

                </button>

            </td>

        </tr>
        `;
    });

}

async function updateRequest(id, status) {

    await fetch(
        "/api/hr/requests/update",
        {

            method: "POST",

            headers: {
                "Content-Type":
                "application/json",

                "x-session-id":
                localStorage.getItem("sessionId")
            },

            body: JSON.stringify({
                id,
                status
            })

        }
    );

    alert("Request Updated");

    loadRequests();

}

loadRequests();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pending Requests</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

header {
  background: #3b6dab;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 20px;
}

.request {
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.btn {
  margin-right: 10px;
  padding: 8px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

.approve { background: green; color: white; }
.reject { background: red; color: white; }
</style>
</head>

<body>

<header>📋 Pending HR Requests</header>

<div class="container">

  <div class="request">
    <p><strong>Leave Request:</strong> John Doe</p>
    <button class="btn approve">Approve</button>
    <button class="btn reject">Reject</button>
  </div>

  <div class="request">
    <p><strong>Salary Revision:</strong> Sarah</p>
    <button class="btn approve">Approve</button>
    <button class="btn reject">Reject</button>
  </div>

  <div class="request">
    <p><strong>Transfer Request:</strong> Michael</p>
    <button class="btn approve">Approve</button>
    <button class="btn reject">Reject</button>
  </div>

</div>

</body>
</html>

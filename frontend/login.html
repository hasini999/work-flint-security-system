<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Employee Login | Work Flint</title>

    <link rel="stylesheet" href="styles.css" />

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(0,0,0,0.6),
                    rgba(0,0,0,0.6)
                ),
                url('assets/corporate-office.jpg');

            background-size: cover;
            background-position: center;
        }

        .login-container {

            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {

            background: white;
            width: 400px;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.25);
        }

        .logo-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-title h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .logo-title p {
            color: #64748b;
            font-size: 14px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {

            margin-top: 12px;
            margin-bottom: 6px;

            font-size: 14px;
            color: #334155;
            font-weight: bold;
        }

        input,
        select {

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 14px;

            outline: none;
        }

        input:focus,
        select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 5px rgba(37, 99, 235, 0.3);
        }

        .password-container {
            position: relative;
        }

        #toggle-password {

            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            color: #2563eb;

            font-size: 13px;
        }

        button {

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition: 0.3s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        .bottom-links {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;
        }

        .bottom-links a {

            color: #2563eb;

            text-decoration: none;
        }

        .bottom-links a:hover {
            text-decoration: underline;
        }

        .security-note {

            margin-top: 18px;

            background: #f1f5f9;

            padding: 10px;

            border-radius: 6px;

            font-size: 12px;

            color: #475569;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo-title">

                <h1>Work Flint</h1>

                <p>
                    Secure Employee Access Portal
                </p>

            </div>

            <form id="login-form">

                <label>Email Address</label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Enter your work email"
                    required
                />

                <label>Password</label>

                <div class="password-container">

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    />

                    <span id="toggle-password">Show</span>

                </div>

                <label>Security Question</label>

                <select id="security-question" required>

                    <option value="">
                        -- Select a Security Question --
                    </option>

                    <option value="pet">
                        What is your pet's name?
                    </option>

                    <option value="school">
                        What was the name of your first school?
                    </option>

                    <option value="color">
                        What is your favorite color?
                    </option>

                    <option value="food">
                        What is your favorite food?
                    </option>

                </select>

                <label>Security Answer</label>

                <input
                    type="text"
                    id="security-answer-field"
                    placeholder="Enter your answer"
                    required
                />

                <button type="submit">
                    Login Securely
                </button>

            </form>

            <div class="bottom-links">

                <p>
                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>
                </p>

                <br>

                <p>
                    New employee?
                    <a href="register.html">
                        Register here
                    </a>
                </p>

            </div>

            <div class="security-note">

                Access to organizational resources is monitored
                and protected under enterprise security policies.

            </div>

        </div>

    </div>

    <script type="module" src="login.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salary Details</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    margin:0;
}

header{
    background:#3b6dab;
    color:white;
    text-align:center;
    padding:15px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
}

</style>
</head>

<body>

<header>
💵 Employee Salary Details
</header>

<div class="container" id="salaryDetails"></div>

<script>

async function loadSalaryDetails(){

    const res = await fetch(
        "/api/hr/salaries",
        {
            headers:{
                "x-session-id":
                localStorage.getItem("sessionId")
            }
        }
    );

    const data = await res.json();

    const container =
        document.getElementById("salaryDetails");

    container.innerHTML = "";

    data.forEach(emp => {

        container.innerHTML += `
        <div class="card">

            <h3>${emp.employee_name}</h3>

            <p>
            Department:
            ${emp.department}
            </p>

            <p>
            Basic Salary:
            ₹${emp.basic_salary}
            </p>

            <p>
            Bonus:
            ₹${emp.bonus}
            </p>

            <p>
            Total Salary:
            ₹${emp.total}
            </p>

        </div>
        `;

    });

}

loadSalaryDetails();

</script>

</body>
</html>

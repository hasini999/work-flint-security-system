<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salary Details</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

header {
  background: #3b6dab;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 20px;
}

table {
  width: 100%;
  background: white;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

th {
  background: #3b6dab;
  color: white;
}
</style>
</head>

<body>

<header>💵 Salary Details</header>

<div class="container">

<table>
  <tr>
    <th>Employee</th>
    <th>Department</th>
    <th>Basic Pay</th>
    <th>Bonus</th>
    <th>Total Salary</th>
  </tr>

  <tr>
    <td>John Doe</td>
    <td>IT</td>
    <td>40,000</td>
    <td>5,000</td>
    <td>45,000</td>
  </tr>

  <tr>
    <td>Sarah</td>
    <td>HR</td>
    <td>35,000</td>
    <td>4,000</td>
    <td>39,000</td>
  </tr>

  <tr>
    <td>Michael</td>
    <td>Finance</td>
    <td>50,000</td>
    <td>6,000</td>
    <td>56,000</td>
  </tr>

</table>

</div>

</body>
</html>

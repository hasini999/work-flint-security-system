<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payroll Management</title>

<style>

body{
    font-family: Arial;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#3b6dab;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    padding:20px;
}

table{
    width:100%;
    border-collapse: collapse;
    background:white;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#3b6dab;
    color:white;
}

</style>
</head>

<body>

<header>
💰 Payroll Management
</header>

<div class="container">

<table>

<thead>
<tr>
<th>Employee</th>
<th>Department</th>
<th>Basic Salary</th>
<th>Bonus</th>
<th>Total</th>
</tr>
</thead>

<tbody id="salaryTable"></tbody>

</table>

</div>

<script>

async function loadSalaries(){

    const res = await fetch(
        "/api/hr/salaries",
        {
            headers:{
                "x-session-id":
                localStorage.getItem("sessionId")
            }
        }
    );

    const data = await res.json();

    const table =
        document.getElementById("salaryTable");

    table.innerHTML = "";

    data.forEach(emp => {

        table.innerHTML += `
        <tr>
            <td>${emp.employee_name}</td>
            <td>${emp.department}</td>
            <td>₹${emp.basic_salary}</td>
            <td>₹${emp.bonus}</td>
            <td>₹${emp.total}</td>
        </tr>
        `;

    });

}

loadSalaries();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payroll - Work Flint HR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

header {
  background: #3b6dab;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.salary-box {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid #eee;
}

.btn {
  padding: 8px 12px;
  background: #3b6dab;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.btn:hover {
  background: #4CAF50;
}
</style>
</head>

<body>

<header>💰 HR Payroll System</header>

<div class="container">

  <div class="card">
    <h3>Monthly Payroll Summary</h3>

    <div class="salary-box">
      <span>Employee Count</span>
      <strong>120</strong>
    </div>

    <div class="salary-box">
      <span>Total Payroll</span>
      <strong>₹12,50,000</strong>
    </div>

    <div class="salary-box">
      <span>Pending Salaries</span>
      <strong>8</strong>
    </div>

    <button class="btn">Generate Payroll</button>
  </div>

</div>

</body>
</html>
